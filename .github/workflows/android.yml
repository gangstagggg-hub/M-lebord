name: Bygg Android (APK og AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Klargjør og sjekk signeringsnøkkel
        env:
          RAW_B64: ${{ secrets.KEYSTORE_BASE64 }}
          RAW_STOREPW: ${{ secrets.KEYSTORE_PASSWORD }}
          RAW_ALIAS: ${{ secrets.KEY_ALIAS }}
          RAW_KEYPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]' | sed -E "s/^$2=//"; }
          B64=$(clean "$RAW_B64" KEYSTORE_BASE64)
          STOREPW=$(clean "$RAW_STOREPW" KEYSTORE_PASSWORD)
          ALIAS=$(clean "$RAW_ALIAS" KEY_ALIAS)
          KEYPW=$(clean "$RAW_KEYPW" KEY_PASSWORD)
          echo "Lengde KEYSTORE_BASE64:   ${#B64} (skal være ca. 3516)"
          echo "Lengde KEYSTORE_PASSWORD: ${#STOREPW} (skal være 32)"
          echo "Lengde KEY_ALIAS:         ${#ALIAS} (skal være 8)"
          echo "Lengde KEY_PASSWORD:      ${#KEYPW} (skal være 32)"
          for n in B64 STOREPW ALIAS KEYPW; do
            if [ -z "${!n}" ]; then echo "::error::Hemmeligheten for $n er tom eller mangler"; exit 1; fi
          done
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STOREPW" > /dev/null 2>&1; then
            echo "::error::Nøkkelfilen eller KEYSTORE_PASSWORD er feil (sjekk lengdene over)"; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STOREPW" -alias "$ALIAS" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS finnes ikke i nøkkelfilen (skal være malebord)"; exit 1
          fi
          echo "Nøkkelen er OK"
          echo "::add-mask::$STOREPW"
          echo "::add-mask::$KEYPW"
          {
            echo "CLEAN_STOREPW=$STOREPW"
            echo "CLEAN_ALIAS=$ALIAS"
            echo "CLEAN_KEYPW=$KEYPW"
          } >> "$GITHUB_ENV"

      - name: Bygg APK og AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ env.CLEAN_STOREPW }}
          KEY_ALIAS: ${{ env.CLEAN_ALIAS }}
          KEY_PASSWORD: ${{ env.CLEAN_KEYPW }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: malebord-apk
          path: app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: malebord-aab
          path: app/build/outputs/bundle/release/*.aab
